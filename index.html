<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>끝말잇기</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- 시작 화면 -->
    <section id="startScreen">
        <h1>끝말잇기</h1>

        <p class="startLetter">
            시작 글자:
            <strong id="startLetter">?</strong>
        </p>

        <div class="modeButtons">
            <button onclick="startGame('player')">선공</button>
            <button onclick="startGame('bot')">후공</button>
            <button onclick="startGame('random')">랜덤</button>
        </div>
    </section>


    <!-- 게임 화면 -->
    <section id="gameScreen" class="hidden">

<div class="top">

    <div>
        목숨:
        <span id="lives">❤️❤️</span>
    </div>

    <div>
        제한시간:
        <span id="timer">20</span>
    </div>

    <button onclick="giveUpRound()">끝내기</button>

</div>

        <div class="required">
            <p>현재 글자</p>
            <h2 id="requiredLetter">?</h2>
        </div>

        <div class="current">
            <p>현재 단어</p>
            <h2 id="currentWord">-</h2>
        </div>

        <div id="turnMessage" class="turnMessage">
            준비 중...
        </div>

        <div class="inputArea">

            <input
                id="wordInput"
                type="text"
                autocomplete="off"
                placeholder="단어를 입력하세요"
            >

            <button id="submitButton" onclick="submitWord()">
                입력
            </button>

        </div>

        <div id="message"></div>

        <div class="historyBox">
            <h3>사용한 단어</h3>
            <div id="history"></div>
        </div>

    </section>


    <!-- 결과 화면 -->
    <section id="endScreen" class="hidden">

        <h1 id="resultTitle"></h1>

        <p id="resultMessage"></p>

        <button onclick="location.reload()">
            다시 하기
        </button>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
